name: Algolia indexing

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  algolia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install dependencies
        run: bundle install
        env:
          BUNDLE_GEMFILE: .github/Gemfile.algolia
      - name: Index content with jekyll-algolia
        run: bundle exec jekyll algolia
        env:
          BUNDLE_GEMFILE: .github/Gemfile.algolia
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
