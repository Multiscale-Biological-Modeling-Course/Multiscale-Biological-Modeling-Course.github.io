name: Algolia indexing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  algolia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install dependencies
        run: bundle install
        env:
          BUNDLE_GEMFILE: .github/algolia/Gemfile
      - name: Index content with jekyll-algolia
        run: bundle exec jekyll algolia
        env:
          BUNDLE_GEMFILE: .github/algolia/Gemfile
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
