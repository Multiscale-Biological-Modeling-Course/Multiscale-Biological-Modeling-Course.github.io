# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: "Biological Modeling"
subtitle: "A Free Online Course in Computational Biology"
masthead_title: "<em>Biological Modeling</em>"
logo: "/assets/images/200px/gray_scott_jupyter_high-res.png"
url: "https://biologicalmodeling.org"
og_image: "/assets/images/turing_hero_poster.jpg"
email:
locale: "en-US"
description: >- # this means to ignore newlines until "baseurl:"
  Power up your computational and machine learning skills with our free course on modeling biological systems.
twitter_username: phillipcompeau
github_username: phcompeau
minimal_mistakes_skin: contrast

# Author settings
author:
  name: "Phillip Compeau"
  home: "https://compeau.cbd.cmu.edu"
  avatar: "/assets/images/600px/compeau_phillip_2023.jpg"
  bio: "Professor at CMU and online education founder. Check out my other projects too!" # Note: Markdown is allowed
  links:
    - label: "Follow me on LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/phillipcompeau/"
    - label: "Programming for Lovers"
      icon: "fas fa-fw fa-heart"
      url: "https://programmingforlovers.com"
    - label: "Bioinformatics Algorithms"
      icon: "fas fa-fw fa-dna"
      url: "https://bioinformaticsalgorithms.org"
    - label: "Rosalind"
      icon: "fas fa-fw fa-laptop"
      url: "https://rosalind.info"


# Search
search: true
search_provider: algolia


# Allow comments
# comments:
#  provider: "disqus"
#  disqus:
#    shortname: "biological-modeling"


# Build settings
markdown: kramdown
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
# Outputting
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

exclude:
  - assets/images_CMYK
  - assets/old
  - assets/tex
  - vendor

# Plugins (previously gems:)
plugins:
  #- jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jemoji
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-algolia
  - kramdown

# Needed to copy code to clipboard
after_footer_scripts:
  - https://cdn.jsdelivr.net/npm/clipboard@2/dist/clipboard.min.js
  - assets/js/clipboardrouge.js

# Search with Algolia
algolia:
  application_id: B3Q5EI8OM3
  index_name: biological_modeling
  search_only_api_key: 809cb9cee21df5bf9f0e36e4af371cfe
  powered_by: true

footer: custom

defaults:
  # _pages (global)
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      comments: true
      share: false
      author_profile: false

  # Per-module og_image defaults — individual lesson pages inherit their module's image
  - scope:
      path: "_pages/prologue"
    values:
      og_image: "/assets/images/gray_scott_jupyter_high-res.png"

  - scope:
      path: "_pages/motifs"
    values:
      og_image: "/assets/images/repressilator_chart.png"

  - scope:
      path: "_pages/chemotaxis"
    values:
      og_image: "/assets/images/ecoli_glucose.png"

  - scope:
      path: "_pages/coronavirus"
    values:
      og_image: "/assets/images/SARS_spike_proteins.jpg"

  - scope:
      path: "_pages/white_blood_cells"
    values:
      og_image: "/assets/images/normal_adult_blood_smear.JPG"

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
